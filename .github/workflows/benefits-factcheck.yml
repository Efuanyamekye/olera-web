# Re-verify benefits program facts on a rotation.
#
# Every Monday it fact-checks ten states (so each state is re-checked about
# every five weeks), runs the judge, regenerates the data modules, and opens a
# pull request with the diff and the review queue. A person merges it.
#
# Needs two repository secrets: PERPLEXITY_API_KEY and ANTHROPIC_API_KEY.
# Runs here, not as a Vercel cron, because the pipeline writes files and needs
# those keys. Manual runs can name the states.
name: Benefits fact-check

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:
    inputs:
      states:
        description: "Space-separated state codes (blank = this week's rotation)"
        required: false
        default: ""

jobs:
  factcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Pick this week's states
        id: pick
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.states }}" ]; then
            echo "states=${{ github.event.inputs.states }}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          ALL=$(ls data/pipeline | grep -E '^[A-Z]{2}$' | sort)
          N=$(echo "$ALL" | wc -l)
          WEEK=$(( $(date +%s) / 604800 ))
          START=$(( (WEEK * 10) % N ))
          STATES=$(echo "$ALL" | awk -v s=$START -v n=$N 'NR>s && NR<=s+10 {print} END{}' )
          # wrap around the end of the list
          COUNT=$(echo "$STATES" | grep -c .)
          if [ "$COUNT" -lt 10 ]; then STATES="$STATES $(echo "$ALL" | head -n $((10 - COUNT)))"; fi
          echo "states=$(echo $STATES | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Fact-check
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          for st in ${{ steps.pick.outputs.states }}; do
            echo "=== $st"
            node scripts/benefits-pipeline.js --state "$st" --phase factcheck --run | tail -8
          done

      - name: Judge and regenerate
        run: |
          STATES="$(echo '${{ steps.pick.outputs.states }}' | tr ' ' ',' | sed 's/,*$//')"
          node scripts/benefits-apply-factcheck.js --apply --states "$STATES" | tail -20
          # Settle phone flags against the page each one cites (free, no model).
          node scripts/benefits-verify-queue.js --apply --states "$STATES" | sed -n '/^phone flags/,/^-- apply/p'
          # The review list is the PR body, written outside the checkout so
          # it is never committed.
          node scripts/benefits-apply-factcheck.js --review --states "$STATES" > "$RUNNER_TEMP/review-queue.txt" || true
          # Each state's run already regenerated its own drafts.ts. A full
          # --regen-index would touch all 51 with new timestamps and bury the
          # real diff, so the summary and barrel churn is reverted here.
          git checkout -- data/pipeline-summary.ts data/pipeline-drafts.ts || true

      - name: Open a pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: benefits-factcheck/${{ github.run_id }}
          base: staging
          title: "Benefits fact-check: ${{ steps.pick.outputs.states }}"
          commit-message: "Re-verify benefits facts: ${{ steps.pick.outputs.states }}"
          body-path: ${{ runner.temp }}/review-queue.txt
          labels: benefits-data
